<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>页面采集器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">LOCAL CAPTURE</div>
      <h1>页面采集器</h1>
      <p class="sub">持续记录 · 分次留档 · <strong id="phase">正在读取</strong></p>
    </header>
    <label class="field-label" for="note">本次备注（选填）</label>
    <textarea id="note" maxlength="4000" placeholder="写下页面用途、操作路径或需要关注的接口"></textarea>
    <p class="hint">每批开始时自动刷新一次。保存后持续记录，关闭小面板不停止；请保持记录状态页打开。</p>
    <div id="status" class="status" role="status"></div>
    <div id="details" class="details"></div>
    <p id="warning" class="warning"></p>
    <button id="start" type="button" hidden>开始本批</button>
    <button id="save" type="button" hidden>保存一次</button>
    <button id="end" type="button" class="secondary" hidden>结束本批</button>
    <button id="retry" type="button" hidden>重试失败文件</button>
    <button id="recover" type="button" hidden>补导出已收数据并结束</button>
    <button id="abandon" type="button" class="danger" hidden>放弃未保存数据并结束</button>
    <button id="openHost" type="button" class="secondary" hidden>打开记录状态页</button>
    <div id="abandonConfirmation" class="confirmation" hidden>
      <p>将停止本批并丢弃尚未成功留档的数据。已经下载的文件保留，工具不会删除它们。</p>
      <button id="confirmAbandon" type="button" class="danger">确认放弃并结束</button>
      <button id="cancelAbandon" type="button" class="secondary">取消</button>
    </div>
    <footer>一批绑定开始时的业务标签页；文件保存在下载目录的 PageCapture 文件夹。</footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
